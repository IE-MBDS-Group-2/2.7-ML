# environment.yml  [Shared conda environment for the team]
# Create:  conda env create -f environment.yml
# Update:  conda env update -f environment.yml --prune
# The last line installs this repo's own package (src/ml2) in editable mode.
name: ml2-group2
channels:
  - conda-forge
dependencies:
  - python=3.12
  # data and modelling
  - pandas
  - numpy
  - scikit-learn
  - lightgbm
  - xgboost
  - scipy
  # database and files
  - sqlalchemy
  - psycopg2
  - pyarrow
  - pyyaml
  - python-dotenv
  # notebooks and plots
  - jupyterlab
  - ipykernel
  - matplotlib
  - seaborn
  # quality
  - pytest
  - pytest-cov
  - flake8
  - pip
  - pip:
      - -e .

# Required status check "checks" (branch rulesets on main and dev): lint and tests.
name: checks

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: flake8 .
      - name: Test
        # pytest exits with 5 when there are no tests yet; treat that as a pass.
        run: pytest || [ $? -eq 5 ]
